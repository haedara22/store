<svg width="800" height="800" viewBox="0 0 800 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316;stop-opacity:0.05" />
      <stop offset="50%" style="stop-color:#fb923c;stop-opacity:0.08" />
      <stop offset="100%" style="stop-color:#fdba74;stop-opacity:0.05" />
    </linearGradient>
    
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fb923c;stop-opacity:1" />
    </linearGradient>

    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="url(#bgGradient)"/>
  
  <!-- Subtle Grid Pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#f97316" stroke-width="0.5" opacity="0.1"/>
  </pattern>
  <rect width="800" height="800" fill="url(#grid)"/>

  <!-- Center Circle Background -->
  <circle cx="400" cy="400" r="200" fill="white" opacity="0.6" filter="url(#shadow)"/>
  
  <!-- Shopping Bag Icon (Modern & Professional) -->
  <g transform="translate(400, 400)" filter="url(#shadow)">
    <!-- Bag Body -->
    <path d="M -80 -40 L -60 80 Q -60 100 -40 100 L 40 100 Q 60 100 60 80 L 80 -40 Z" 
          fill="url(#iconGradient)" 
          opacity="0.9"/>
    
    <!-- Bag Handle -->
    <path d="M -50 -40 Q -50 -80 0 -80 Q 50 -80 50 -40" 
          fill="none" 
          stroke="url(#iconGradient)" 
          stroke-width="12" 
          stroke-linecap="round"/>
    
    <!-- Highlight -->
    <path d="M -70 -30 L -55 60" 
          stroke="white" 
          stroke-width="8" 
          stroke-linecap="round" 
          opacity="0.3"/>
  </g>

  <!-- Store Name "الحامد" in Arabic (Stylized) -->
  <g transform="translate(400, 580)">
    <text x="0" y="0" 
          font-family="Arial, sans-serif" 
          font-size="48" 
          font-weight="bold" 
          fill="#f97316" 
          text-anchor="middle"
          letter-spacing="2">
      متجر الحامد
    </text>
  </g>

  <!-- Decorative Elements -->
  <circle cx="200" cy="200" r="4" fill="#f97316" opacity="0.3"/>
  <circle cx="600" cy="600" r="4" fill="#f97316" opacity="0.3"/>
  <circle cx="200" cy="600" r="6" fill="#fb923c" opacity="0.2"/>
  <circle cx="600" cy="200" r="6" fill="#fb923c" opacity="0.2"/>
</svg>
