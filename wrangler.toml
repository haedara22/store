name = "alhamed-store"
main = ".open-next/worker.js"
compatibility_date = "2026-08-16"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "alhamed-store"

[images]
binding = "IMAGES"

# Environment variables will be set in Cloudflare Dashboard or via wrangler secrets
# DATABASE_URL - set via: wrangler secret put DATABASE_URL
# ADMIN_USERNAME - set via: wrangler secret put ADMIN_USERNAME  
# ADMIN_PASSWORD - set via: wrangler secret put ADMIN_PASSWORD

[vars]
NEXT_PUBLIC_SITE_URL = "https://alhamed-store.workers.dev"
